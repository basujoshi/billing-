<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Settings</title>
<style>body{font-family:Arial;background:#f3f4f6;padding:20px}.box{max-width:600px;margin:auto;background:white;padding:20px;border-radius:15px}input{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}button{padding:12px;width:100%;margin-top:8px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:bold}</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="firebase-config.js"></script><script src="firebase-multiuser.js"></script></head>
<body><div class="box"><h2>Shop Settings</h2><input id="shop" placeholder="Shop name"><input id="owner" placeholder="Owner name"><input id="phone" placeholder="Phone"><button onclick="save()">SAVE</button><button onclick="location.href='dashboard.html'">DASHBOARD</button><p id="msg"></p></div>
<script>billingRunAfterAuth(function(u){window.multiUserDb.ref("profile").once("value").then(function(s){var p=s.val()||{};shop.value=p.shopName||"";owner.value=p.ownerName||"";phone.value=p.phone||"";});});function save(){billingRunAfterAuth(function(u){window.multiUserDb.ref("profile").update({shopName:shop.value.trim(),ownerName:owner.value.trim(),phone:phone.value.trim(),email:u.email,updatedAt:new Date().toISOString()}).then(function(){msg.textContent="Saved.";});});}</script></body></html>
