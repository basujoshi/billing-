<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing Multi User - Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial;background:linear-gradient(135deg,#06111f,#111827);color:#fff}
.card{width:min(420px,92vw);padding:28px;border-radius:20px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{margin:0 0 8px}p{color:#b9c3d0}input{width:100%;padding:13px;margin:7px 0;border:1px solid #4b5563;border-radius:10px;background:#0b1220;color:#fff}button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.login{background:#00d4ff}.register{background:#fff}.msg{min-height:22px;margin-top:10px;color:#ffd166}.brand{font-weight:800;color:#00d4ff}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-multiuser.js"></script>
</head>
<body>
<div class="card">
<div class="brand">B.D. BAJAR BILLING</div>
<h1>Login</h1><p>Sign in to your own shop account.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="login" onclick="login()">LOGIN</button>
<button class="register" onclick="location.href='register.html'">CREATE NEW SHOP ACCOUNT</button>
<div class="msg" id="msg"></div>
</div>
<script>
billingAuth.onAuthStateChanged(function(u){if(u) location.replace(new URLSearchParams(location.search).get("returnTo") || "Billing3.html");});
function login(){
 const e=document.getElementById("email").value.trim(), p=document.getElementById("password").value, m=document.getElementById("msg");
 if(!e||!p){m.textContent="Email and password required.";return;}
 m.textContent="Signing in...";
 billingAuth.signInWithEmailAndPassword(e,p).catch(function(err){m.textContent=err.message;});
}
</script>
</body></html>
