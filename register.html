<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Shop Account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial;background:#f3f4f6}.card{width:min(480px,92vw);padding:25px;border-radius:18px;background:#fff;box-shadow:0 15px 45px rgba(0,0,0,.15)}h1{margin-top:0}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:9px}button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:10px;min-height:20px;color:#b42318}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="firebase-config.js"></script><script src="firebase-multiuser.js"></script>
</head><body><div class="card">
<h1>Create Shop Account</h1>
<input id="shop" placeholder="Shop name">
<input id="owner" placeholder="Owner name">
<input id="phone" placeholder="Phone number">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (6+ characters)">
<button onclick="registerUser()">CREATE ACCOUNT</button>
<button onclick="location.href='index.html'" style="background:#fff;color:#111;border:1px solid #111">BACK TO LOGIN</button>
<div class="msg" id="msg"></div>
</div>
<script>
function registerUser(){
 const shop=document.getElementById("shop").value.trim(), owner=document.getElementById("owner").value.trim(), phone=document.getElementById("phone").value.trim(), email=document.getElementById("email").value.trim(), pass=document.getElementById("password").value, m=document.getElementById("msg");
 if(!shop||!owner||!email||!pass){m.textContent="Shop, owner, email and password are required.";return;}
 m.textContent="Creating account...";
 billingAuth.createUserWithEmailAndPassword(email,pass).then(function(cred){
   return billingDatabase.ref("users/"+cred.user.uid+"/profile").set({
     shopName:shop, ownerName:owner, phone:phone, email:email, createdAt:new Date().toISOString()
   });
 }).then(function(){location.replace("Billing3.html");}).catch(function(err){m.textContent=err.message;});
}
</script></body></html>
