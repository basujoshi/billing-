<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Return Summary</title>




<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:black;
color:white;
padding:10px;
}

td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

.total{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
</style>
</head>
<body><div id="multiUserBar" style="position:fixed;bottom:12px;left:12px;z-index:99999;background:#111;color:#fff;padding:9px 12px;border-radius:10px;font:12px Arial;display:flex;gap:8px;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.25)">
<span id="multiUserEmail">Loading user...</span>
<button onclick="billingLogout()" style="border:0;border-radius:7px;padding:6px 9px;cursor:pointer">Logout</button>
</div>
<script>
billingRunAfterAuth(function(user){ var el=document.getElementById("multiUserEmail"); if(el) el.textContent=user.email || "User"; });
</script>


<h1>Return Stock Summary</h1>

<table>
<thead>
<tr>
<th>Return No</th>
<th>Date</th>
<th>Customer</th>
<th>Item</th>
<th>Code</th>
<th>Qty</th>
<th>Rate</th>
<th>Amount</th>
</tr>
</thead>

<tbody id="returnData"></tbody>

</table>

<div class="total">
Total Return Amount :
₹ <span id="grandTotal">0.00</span>
</div>




<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-multiuser.js"></script>
<script>
window.addEventListener("DOMContentLoaded", function() {
  billingRunAfterAuth(function(user) {
    const db = window.multiUserDb;








let grandTotal = 0;

db.ref("returnStock").once("value").then(snapshot=>{

let html = "";

snapshot.forEach(returnSnap=>{

const data = returnSnap.val();

(data.items || []).forEach(item=>{

grandTotal += Number(item.amount || 0);

html += `
<tr>
<td>${data.returnNo}</td>
<td>${data.date}</td>
<td>${data.customerName}</td>
<td>${item.item}</td>
<td>${item.code}</td>
<td>${item.returnQty}</td>
<td>${item.rate}</td>
<td>${item.amount}</td>
</tr>
`;

});

});

document.getElementById("returnData").innerHTML = html;

document.getElementById("grandTotal").innerText =
grandTotal.toFixed(2);

});


  });
});
</script>
</body>
</html>
