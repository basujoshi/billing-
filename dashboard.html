<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing Dashboard</title>
<style>body{font-family:Arial;margin:0;background:#f4f6f8;padding:20px}.wrap{max-width:1100px;margin:auto}.head{background:#111;color:#fff;padding:20px;border-radius:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:16px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 5px 20px #0001}.card b{font-size:28px}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}.links a{background:#111;color:#fff;text-decoration:none;padding:14px;border-radius:10px;text-align:center}</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="firebase-config.js"></script><script src="firebase-multiuser.js"></script>
</head><body><div class="wrap"><div class="head"><div><div id="shop">Loading...</div><small id="email"></small></div><button onclick="billingLogout()">Logout</button></div>
<div class="grid"><div class="card">Bills<br><b id="bills">0</b></div><div class="card">Stock Items<br><b id="stocks">0</b></div><div class="card">Customers<br><b id="customers">0</b></div><div class="card">Returns<br><b id="returns">0</b></div></div>
<div class="links"><a href="Billing3.html">Billing</a><a href="billingstock.html">Stock</a><a href="Billing3 Return.html">Return</a><a href="Billing3 reprint.html">Reprint</a><a href="Billing3 summary.html">Summary</a><a href="Billing3 Cash out.html">Cash Out</a><a href="Billing3 costomer data.html">Customers</a><a href="Billing3 editing.html">Edit Bill</a></div></div>
<script>billingRunAfterAuth(function(u){document.getElementById("email").textContent=u.email||"";billingDatabase.ref("users/"+u.uid+"/profile").once("value").then(function(s){document.getElementById("shop").textContent=(s.val()||{}).shopName||"My Shop";});["bills","stocks","customers","returns"].forEach(function(k){window.multiUserDb.ref(k).once("value").then(function(s){document.getElementById(k).textContent=s.numChildren();});});});</script>
</body></html>
